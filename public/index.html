<style>
:root{
  --bg:#F6F3EC; --card:#FFFFFF; --ink:#141B2B; --muted:#5E6577; --line:#ECEEF3; --border:#D9DEE8;
  --navy:#16274A; --navy2:#0E1B36; --hero:#16274A; --heroMuted:#C7D0E3; --track:#34466B;
  --gold:#C9A45C; --goldSoft:#D6B370; --goldBtn:#B8913F; --warn:#B04A12; --ok:#1D6B4A; --okBg:#E3F0EA;
  --nav:#FFFFFF; --c1:#16274A; --tabOn:#E1E7F3; --wmOp:.35; --wmGcolor:#16274A;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0B1220; --card:#162036; --ink:#EEF1F6; --muted:#9AA5BA; --line:#1F2A42; --border:#2A3754;
  --navy:#D6B370; --navy2:#E8D3A0; --hero:#1C3160; --heroMuted:#C7D0E3; --track:#34466B;
  --warn:#FFA273; --ok:#7FD9AE; --okBg:#14302A; --nav:#111A2C; --c1:#7D95CC; --tabOn:#22304F; --wmOp:.3; --wmGcolor:#EEF1F6;
}}
body.bordo{--navy:#7A1F33;--navy2:#5C1525;--hero:#6B1A2B;--heroMuted:#E8C9CF;--track:#8E3A4C;--c1:#6B1A2B;--wmGcolor:#6B1A2B;--tabOn:#F3E1E4;--gold:#C9967A;--goldSoft:#E0B9A2;--goldBtn:#A8705A}
body.bordo .btn:not(.ghost):not(.danger),body.bordo .mono,body.bordo .chip.on{background:#6B1A2B;border-color:#6B1A2B}
@media (prefers-color-scheme: dark){body.bordo{--bg:#140A0D;--card:#24131A;--line:#33202A;--border:#45303A;--nav:#1B0E13;--navy:#E0B9A2;--hero:#5A1726;--c1:#D98A9C;--wmGcolor:#EEF1F6;--tabOn:#3A1820}body.bordo{background:#140A0D}body.bordo .btn:not(.ghost):not(.danger){background:#C9967A;color:#1A0B10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
body{min-height:100vh;padding-bottom:calc(170px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px 24px;position:relative;z-index:1;display:flex;flex-direction:column;gap:18px}
.wm{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));pointer-events:none;z-index:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:18px;opacity:var(--wmOp)}
.wm .sg{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:44px;line-height:1;letter-spacing:-4px;color:var(--gold)}
.wm .sg b{font-weight:500;color:var(--wmGcolor)}
.wm .fin{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:6px;text-transform:uppercase;color:var(--wmGcolor)}
.top{display:flex;justify-content:space-between;align-items:center}
.top small{display:block;color:var(--muted);font-size:13px}
.top h1{margin:0;font-size:22px;font-weight:800}
.mono{width:44px;height:44px;border-radius:12px;background:#16274A;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:22px;letter-spacing:-5px;color:#D6B370}
.mono b{color:#F6F3EC;font-weight:600}
.month{display:flex;align-items:center;gap:4px}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer}
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .lbl{color:var(--heroMuted);font-size:13px}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-.5px}
.hero .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.hero .row div{display:flex;flex-direction:column;gap:2px}
.hero .row b{font-weight:700}
.hero .head{display:flex;justify-content:space-between;align-items:center}
.eye{width:44px;height:44px;margin:-12px -10px -12px 0;border:0;background:none;color:var(--heroMuted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bar{height:8px;border-radius:4px;background:var(--line);display:flex;overflow:hidden}
.bar i{display:block;border-radius:4px;background:var(--navy)}
.hero .bar{background:var(--track)} .hero .bar i{background:#D6B370}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.tile span{font-size:12px;color:var(--muted)} .tile b{font-size:15px}
.tile.ok{background:var(--okBg)} .tile.ok span,.tile.ok b{color:var(--ok)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline}
.sec-h span{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.sec-h b{font-size:13px}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.item .t b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{font-size:12px;color:var(--muted)}
.item .v{font-weight:700;white-space:nowrap}
.warn{color:var(--warn)!important;font-weight:600} .okc{color:var(--ok)!important;font-weight:600}
.empty{padding:16px;color:var(--muted);font-size:14px;text-align:center}
.add{height:48px;border-radius:14px;border:1.5px dashed var(--border);background:transparent;font-weight:700;color:var(--navy);cursor:pointer}
.btn{height:48px;border-radius:14px;border:0;background:#16274A;color:#fff;font-weight:700;cursor:pointer;padding:0 18px}
@media (prefers-color-scheme: dark){.btn{background:#C9A45C;color:#0B1220}}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--border)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--border)}
.card{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.dark{background:var(--hero);color:#fff}
.card .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .h div{display:flex;flex-direction:column;gap:2px}
.card .h small{font-size:12px;color:var(--muted)} .card.dark .h small,.card.dark .sm{color:var(--heroMuted)}
.card.dark .bar{background:var(--track)} .card.dark .bar i{background:#D6B370}
.sm{font-size:12px;color:var(--muted)}
.split{height:18px;border-radius:9px;display:flex;overflow:hidden}
.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(96px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:28px;border:0;background:var(--goldBtn);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:5;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav button{height:64px;border:0;background:none;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
nav button{position:relative}nav button.on{color:var(--navy)}nav button.on::before{content:'';position:absolute;inset:6px 6px;border-radius:12px;background:var(--tabOn);z-index:-1}nav div{position:relative;z-index:0}
nav svg{width:22px;height:22px}
/* folha de formulário */
.sheet-bg{cursor:pointer;-webkit-tap-highlight-color:transparent;position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{cursor:auto;background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.sheet>*{flex-shrink:0}.sheet{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-height:85dvh}
.sheet h2{margin:0 0 4px;font-size:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{height:48px;border-radius:12px;border:1px solid var(--border);background:var(--card);padding:0 14px;font-size:16px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--border);background:var(--card);font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:#16274A;color:#fff;border-color:#16274A}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;position:relative;z-index:1}
.login .logo{width:120px;height:120px;border-radius:28px}
.login input{height:56px;width:240px;text-align:center;font-size:20px;letter-spacing:4px;border-radius:14px;border:1px solid var(--border);background:var(--card)}
.err{color:var(--warn);font-size:14px;min-height:20px}
.gasto{border-bottom:1px solid var(--line)}.gasto:last-child{border-bottom:0}.gasto .item{border-bottom:0;padding-bottom:6px}
.catchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.cc{height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--border);background:transparent;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.cc.on{background:#1D6B4A;border-color:#1D6B4A;color:#fff}
.catchips{padding-bottom:8px}.parc{border-bottom:1px solid var(--line)}.parc .item{border-bottom:0}
.busca{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--muted)}
.busca input{flex:1;border:0;background:transparent;font-size:16px;outline:none;color:var(--ink);min-width:0}
.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}.swipe:last-child{border-bottom:0}
.swipe-del{position:absolute;right:0;top:0;bottom:0;width:84px;border:0;background:#C0392B;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.swipe-fg{position:relative;background:var(--card);transition:transform .2s;border-bottom:0!important}
.gacoes{display:flex;gap:8px;padding:0 14px 12px}
.ga{height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:12.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;cursor:pointer}
.ga.on{background:var(--tabOn);border-color:var(--tabOn)}.ga.del{color:var(--warn);margin-left:auto}
.catsel{display:block;padding:0 14px 12px}.catsel select{height:36px;border-radius:18px;border:1px solid var(--border);background:var(--bg);padding:0 30px 0 12px;font-size:14px;font-weight:600;color:var(--navy);appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px;background-repeat:no-repeat}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#16274A;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.2s;z-index:30;pointer-events:none;white-space:nowrap}.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-color-scheme: dark){[style*="#FBE9E7"]{background:#3A1614!important;color:#FF9C8F!important}}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px}
</style>
</head>
<body>
<div class="wm" aria-hidden="true"><span class="sg">S<b>G</b></span><span class="fin">Finanças</span><span style="font-size:10px;letter-spacing:1px;color:var(--muted)">v41</span></div>
<main id="app"></main>
<script>
const CATS=['Compras','Mercado','Saúde','Assinaturas','Caio','Delivery','Viagem','Carro','Bares'];
const ESSENCIAIS=['Mercado','Transporte','Saúde','Casa','Contas','Educação'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let db=null, tab='inicio', mes=(()=>{const d=new Date();let y=d.getFullYear(),m=d.getMonth();if(!m){m=12;y--}return y+'-'+String(m).padStart(2,'0')})(); // mês de referência = mês passado
let busca='';
function semAcento(t){return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function filtrar(q){busca=q;const t=semAcento(q.trim());let n=0;document.querySelectorAll('.gasto[data-busca]').forEach(el=>{const ok=!t||semAcento(el.dataset.busca).includes(t);el.style.display=ok?'':'none';if(ok)n++});document.querySelectorAll('.parc').forEach(el=>{el.style.display=!t||semAcento(el.textContent).includes(t)?'':'none'});let v=document.getElementById('semres');if(t&&!n){if(!v){v=document.createElement('div');v.id='semres';v.className='empty';v.textContent='Nada encontrado';document.querySelector('.gasto[data-busca]')?.parentNode.appendChild(v)}}else v?.remove()}
let oculto=false; try{oculto=localStorage.getItem('oculto')==='1'}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>((Math.abs(v)<0.005?0:v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hid=v=>oculto?'R$ ••••':brl(v);
const mesNome=m=>{const[y,mm]=m.split('-');return MESES[mm-1][0].toUpperCase()+MESES[mm-1].slice(1)+' '+y};
const addMes=(m,n)=>{let[y,mm]=m.split('-').map(Number);mm+=n;y+=Math.floor((mm-1)/12);mm=((mm-1)%12+12)%12+1;return y+'-'+String(mm).padStart(2,'0')};
const diffMes=(a,b)=>{const[y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return(y2-y1)*12+(m2-m1)};
const hoje=()=>new Date().toISOString().slice(0,10);
const dataBR=d=>d.split('-').reverse().slice(0,2).join('/');

function aviso(t){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2200)}
async function api(url,method='GET',data){
  if(db&&db.demo&&method!=='GET'&&url!=='/api/login'&&url!=='/api/gmail'){aviso('Modo demonstração: só para visualização');throw new Error('demo')}
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined,credentials:'same-origin'});
  if(r.status===401&&url!=='/api/login'){db=null;return render()}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.erro||'Erro');
  return j;
}
async function carregar(){try{db=await api('/api/state')}catch(e){db=null}render();if(db)iconeBonito()}
// desenha o ícone com a fonte da logo (o servidor não tem a fonte) e envia uma vez
async function iconeBonito(){
  if(db.demo||db.trocarSenha)return;const mo=db.mono||'SG',bd=db.tema==='bordo',chave='icone-'+mo+(bd?'b':'')+'v2';
  try{if(localStorage.getItem('icone')===chave)return}catch(e){}
  try{
    await document.fonts.load('italic 500 100px "Cormorant Garamond"');
    const out={};
    for(const sz of [180,512]){
      const cv=document.createElement('canvas');cv.width=cv.height=sz;const x=cv.getContext('2d'),k=sz/512;
      x.fillStyle=bd?'#6B1A2B':'#16274A';x.fillRect(0,0,sz,sz);
      x.strokeStyle=bd?'#C9967A':'#C9A45C';x.lineWidth=4*k;x.beginPath();x.roundRect(56*k,56*k,400*k,400*k,84*k);x.stroke();
      x.font=`italic 500 ${300*k}px "Cormorant Garamond"`;x.textAlign='center';
      x.fillStyle=bd?'#E0B9A2':'#D6B370';x.fillText(mo[0],212*k,340*k);x.globalAlpha=.92;x.fillStyle='#F6F3EC';x.fillText(mo.slice(1),300*k,398*k);
      out['png'+sz]=cv.toDataURL('image/png');
    }
    await api('/api/icon','POST',out);
    try{localStorage.setItem('icone',chave)}catch(e){}
  }catch(e){}
}
async function salvar(url,method,data){db=await api(url,method,data);fechar();render()}

// ---------- cálculos do mês ----------
const cal=m=>addMes(m,1); // mês do calendário em que o mês de referência m é pago/recebido
function entradasDe(m){return (db.entradas||[]).filter(e=>e.data.startsWith(cal(m))).sort((a,b)=>b.data.localeCompare(a.data))}
function rendaDe(m){return entradasDe(m).reduce((s,e)=>s+e.valor,0)+((db.rendas||{})[m]||0)}
// poupança: cada registro é o SALDO total da poupança naquele momento
// poupança: registro "saldo" = total da poupança naquele momento; registro "soma" = valor guardado que se soma ao que já tinha
// poupança: registros com "xp" na descrição = valor fixo da XP (só soma no total);
// os demais = saldo total do Itaú. Total = último saldo do Itaú + último valor da XP. Guardado = diferença do Itaú.
const ehXP=r=>/\bxp\b/i.test(r.nota||'');
function snaps(){const ss=db.reserva.map((r,i)=>({...r,_i:i})).sort((a,b)=>a.mes.localeCompare(b.mes)||(a.em||'').localeCompare(b.em||'')||a._i-b._i);
  let it=0,xp=0,itAnt=null;ss.forEach(r=>{if(ehXP(r)){xp=r.valor;r.dif=null}else{r.dif=itAnt==null?null:r.valor-itAnt;itAnt=r.valor;it=r.valor}r.bal=it+xp});return ss}
function ultimo(m,cmp,xp){const ss=snaps().filter(r=>cmp(r.mes,m)&&ehXP(r)===xp);return ss.length?ss[ss.length-1].valor:0}
function saldoAte(m){return ultimo(m,(a,b)=>a<=b,false)+ultimo(m,(a,b)=>a<=b,true)}
function saldoAntes(m){return ultimo(m,(a,b)=>a<b,false)+ultimo(m,(a,b)=>a<b,true)}
function guardadoNo(m){const ss=snaps().filter(r=>!ehXP(r));if(!ss.some(r=>r.mes===m)||ss[0].mes===m)return 0;return ultimo(m,(a,b)=>a<=b,false)-ultimo(m,(a,b)=>a<b,false)}
function calc(m){
  const c=db.config, renda=rendaDe(m);
  const pagos=new Set(db.pagos[m]||[]);
  const fixas=db.fixas.map(f=>({...f,pago:pagos.has(f.id)})).sort((a,b)=>a.dia-b.dia);
  const normTit=t=>String(t||'').replace(/\s*\(\d+\/\d+\)\s*$/,'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'');
  const gMes=db.gastos.filter(g=>(g.mes||g.data.slice(0,7))===cal(m));
  const casa=p=>{const n=normTit(p.desc);return n.length>=3&&gMes.find(g=>{const t=normTit(g.desc);return t===n||(n.length>=4&&t.length>=4&&(t.includes(n)||n.includes(t)))})};
  // parcela cadastrada à mão que já veio na fatura deste mês: usa o valor do lançamento e não soma duas vezes
  const parcelas=db.parceladas.map(p=>({...p,n:diffMes(p.primeiroMes,m)+1})).filter(p=>p.n>=1&&p.n<=p.total).map(p=>{const g=casa(p);return g?{...p,valorParcela:g.valor,naFatura:g.id}:p});
  const gastos=db.gastos.filter(g=>(g.mes||g.data.slice(0,7))===cal(m)).sort((a,b)=>b.data.localeCompare(a.data));
  // boleto de fatura do cartão: as compras já estão em Gastos, então não soma de novo
  const chFat=new Set(db.gastos.filter(g=>g.fonte==='fatura'&&g.chave).map(g=>g.chave.split('|')[0]));
  const boletos=db.boletos.filter(b=>b.venc.startsWith(cal(m))).map(b=>({...b,ehFatura:b.ehFatura||chFat.has(b.msgId)||chFat.has(b.codigo)||/fatura|cart[aã]o/i.test(b.desc+' '+(b.assunto||''))&&db.gastos.some(g=>g.fonte==='fatura')})).sort((a,b)=>a.venc.localeCompare(b.venc));
  const guardado=guardadoNo(m);
  // fixa marcada como Cartão já vem na fatura: não soma de novo
  const tFix=fixas.filter(f=>!f.cartao).reduce((s,f)=>s+f.valor,0), tPar=parcelas.filter(p=>!p.naFatura).reduce((s,p)=>s+p.valorParcela,0);
  const tGas=gastos.reduce((s,g)=>s+g.valor,0), tBol=boletos.filter(b=>!b.ehFatura).reduce((s,b)=>s+b.valor,0);
  const tri=0;
  const gastoTotal=Math.max(0,tFix+tPar+tGas+tBol-tri);
  const faltaPagar=fixas.filter(f=>!f.pago).reduce((s,f)=>s+f.valor,0)+boletos.filter(b=>!b.pago).reduce((s,b)=>s+b.valor,0);
  const meta=renda*.25;
  const ess=tFix+tBol+gastos.filter(g=>ESSENCIAIS.includes(g.categoria)).reduce((s,g)=>s+g.valor,0)+parcelas.filter(p=>ESSENCIAIS.includes(p.categoria)).reduce((s,p)=>s+p.valorParcela,0);
  const livre=gastoTotal-ess;
  const porCat={};fixas.filter(f=>!f.cartao).forEach(f=>{const k=CATS.includes(f.categoria)?f.categoria:'Fixas';porCat[k]=(porCat[k]||0)+f.valor});gastos.forEach(g=>{const k=g.categoria||'Sem categoria';porCat[k]=(porCat[k]||0)+g.valor});parcelas.forEach(p=>porCat[p.categoria]=(porCat[p.categoria]||0)+p.valorParcela);
  const acumulado=saldoAte(m);
  return{tri,renda,fixas,parcelas,gastos,boletos,guardado,tFix,tPar,tGas,tBol,gastoTotal,faltaPagar,meta,ess,livre,porCat,acumulado,
    sobra:renda-gastoTotal-meta};
}

function telaGraficos(c){

    const d=`M${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${lg} 0 ${x4} ${y4}Z`;ang=a2;return`<path d="${d}" fill="${CORES[k]||'#9AA3B5'}"/>`}).join('');
  // últimos 6 meses

  <div class="card"><div class="sec-h"><span>${meses.length>1?'Mês a mês':'Este mês'}</span></div>
    <div style="display:flex;gap:14px;font-size:12px;color:var(--muted)"><span style="display:flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:3px;background:#C9A45C"></i>Recebido</span><span style="display:flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:3px;background:var(--c1)"></i>Gasto</span></div>
    <div style="display:grid;grid-template-columns:repeat(${Math.max(meses.length,3)},minmax(0,1fr));gap:6px;align-items:end;height:150px">${vals.map(v=>`<div style="display:flex;gap:3px;align-items:flex-end;justify-content:center;height:100%"><i title="Recebido ${brl(v.r)}" style="width:${meses.length>3?12:28}px;border-radius:3px 3px 0 0;background:#C9A45C;height:${v.r/mx*100}%"></i><i title="Gasto ${brl(v.g)}" style="width:${meses.length>3?12:28}px;border-radius:3px 3px 0 0;background:var(--c1);height:${v.g/mx*100}%"></i></div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(${Math.max(meses.length,3)},minmax(0,1fr));gap:6px;font-size:11px;color:var(--muted);text-align:center">${vals.map(v=>`<span style="${v.m===mes?'font-weight:800;color:var(--ink)':''}">${MESES[+v.m.slice(5)-1].slice(0,3)}</span>`).join('')}</div>
  </div>`;
}
async function apagarItem(t,id,k){if(db.demo)return aviso('Modo demonstração: só para visualização');const lista={fixas:db.fixas,gastos:db.gastos,parceladas:db.parceladas}[t];const x=lista&&lista.find(i=>i.id===id);if(!x||!confirm('Excluir "'+(x.desc||x.nome||'item')+'"?'))return;
  db=await api('/api/'+t+'/'+id,'DELETE');render();detalheCat(k)}
function detalheCat(k){const c=calc(mes);const itens=[];
  c.fixas.filter(f=>!f.cartao).forEach(f=>{const kk=CATS.includes(f.categoria)?f.categoria:'Fixas';if(kk===k)itens.push({t:'fixas',id:f.id,n:f.nome,s:'Despesa fixa',v:f.valor})});
  c.gastos.forEach(g=>{if((g.categoria||'Sem categoria')===k)itens.push({t:'gastos',id:g.id,n:g.desc||g.categoria,s:(g.forma||'')+' · '+dataBR(g.data)+(g.fonte==='fatura'?' · fatura':''),v:g.valor})});
  c.parcelas.filter(p=>!p.naFatura).forEach(p=>{if(p.categoria===k)itens.push({t:'parceladas',id:p.id,n:p.desc,s:'Parcela '+p.n+' de '+p.total,v:p.valorParcela})});
  itens.sort((a,b)=>b.v-a.v);const tot=itens.reduce((a,x)=>a+x.v,0);

function telaPoupanca(c){
  const pg=c.meta?Math.min(100,c.guardado/c.meta*100):0;
  return topo('Poupança',`Renda de ${MESES[+mes.slice(5)-1]}: ${hid(c.renda)}`)+`

  <div class="card dark"><div class="h"><div><b>Reserva de emergência</b><small>25% do que você recebeu no mês · obrigatório</small></div><b>${brl(c.meta)}</b></div>
    <div class="sm" style="display:flex;justify-content:space-between"><span>Guardado este mês</span><b style="color:#D6B370">${brl(c.guardado)} de ${brl(c.meta)}</b></div>
    <div class="bar"><i style="width:${pg}%"></i></div>
    <span class="sm">${c.guardado>=c.meta&&c.meta?'Meta do mês cumprida':'Faltam '+brl(Math.max(0,c.meta-c.guardado))}</span>
    <div style="display:flex;justify-content:space-between;align-items:center;width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;font-size:12px;cursor:pointer"><span style="color:var(--heroMuted)">Saldo atual</span><b style="color:#fff">${hid(c.acumulado)}</b></div>
    <button class="btn" style="background:#C9A45C;color:#0B1220" onclick="formReserva()">Registrar na poupança</button></div>
  ${(()=>{const ss0=snaps();const ini=ss0.length>1?addMes(ss0[0].mes,1):'2026-10';const meses=[...Array(12)].map((_,i)=>addMes(mes,i-11)).filter(m=>m>=ini);
    const v=meses.map(m=>({m,no:Math.max(0,guardadoNo(m)),neg:guardadoNo(m)<0,ac:saldoAte(m)}));
    const mx=Math.max(1,...v.map(x=>x.no));const w=v.length>4?22:48;
    return`<div class="card"><div class="sec-h"><span>Poupança acumulada</span><b>${hid(c.acumulado)}</b></div>
    <div class="sm">Quanto a poupança cresceu em cada mês · saldo atual no topo</div>
    <div style="display:grid;grid-template-columns:repeat(${Math.max(v.length,3)},minmax(0,1fr));gap:6px;align-items:end;height:150px">${v.map(x=>`<div style="display:flex;gap:3px;align-items:flex-end;justify-content:center;height:100%"><i title="${brl(x.no)}" style="width:${w}px;border-radius:4px 4px 0 0;background:#1D6B4A;height:${x.no/mx*100}%"></i></div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(${Math.max(v.length,3)},minmax(0,1fr));gap:6px;font-size:11px;color:var(--muted);text-align:center">${v.map(x=>`<span style="${x.m===mes?'font-weight:800;color:var(--ink)':''}">${MESES[+x.m.slice(5)-1].slice(0,3)}</span>`).join('')}</div>
    <div class="sm" style="display:flex;justify-content:space-between"><span>Guardado em ${MESES[+mes.slice(5)-1]}</span><b style="color:var(--ink)">${brl(c.guardado||0)}</b></div>
    </div>`})()}
  ${db.reserva.length?`<div class="sec"><div class="sec-h"><span>Saldos registrados</span></div>${(()=>{const ss=snaps();if(!ss.length)return"";const m0=ss[0].mes;return`<div class="card" style="flex-direction:row;justify-content:space-between;align-items:center"><span class="sm">Total de ${mesNome(m0).toLowerCase()} (itaú + xp)</span><b>${brl(saldoAte(m0))}</b></div>`})()}<div class="list">${(()=>{const ss=snaps();return ss.map((r,i)=>({r,d:i?r.dif:null})).reverse().map(({r,d})=>`<button class="item" onclick="formReserva('${r.id}')"><div class="t"><b>${mesNome(r.mes)}</b><small>${ehXP(r)?'XP · soma no total':(r.dif==null?'Saldo inicial':(r.dif>=0?'+ ':'− ')+brl(Math.abs(r.dif))+' guardado')}${r.nota&&!ehXP(r)?' · '+esc(r.nota):''}</small></div><span class="v">${brl(r.valor)}</span></button>`).join('')})()}</div></div>`:''}`;
}

  document.body.classList.toggle('bordo',db.tema==='bordo');const wm=document.querySelector('.wm .sg');if(wm){const mo=db.mono||'SG';wm.innerHTML=esc(mo[0])+'<b>'+esc(mo.slice(1))+'</b>'}
  const c=calc(mes);

  if(!document.querySelector('nav')){
    const n=document.createElement('nav');document.body.appendChild(n);
    const f=document.createElement('button');f.className='fab';f.setAttribute('aria-label','Lançar gasto');f.textContent='+';f.onclick=()=>tab==='fixas'?formFixa():formGasto();document.body.appendChild(f);
  }
  const nomes={inicio:'Início',fixas:'Fixas',gastos:'Gastos',graficos:'Gráficos',poupanca:'Poupança'};

  document.querySelector('nav').innerHTML='<div>'+Object.keys(nomes).map(k=>`<button class="${k===tab?'on':''}" onclick="ir('${k}')" ${k===tab?'aria-current="page"':''}>${I[k]}${nomes[k]}</button>`).join('')+'</div>';

(function(){let el=null,x0=0,y0=0,dx=0,mov=false;
  addEventListener('touchstart',e=>{const s=e.target.closest('.swipe');document.querySelectorAll('.swipe-fg').forEach(f=>{if(!s||f.parentNode!==s)f.style.transform=''});if(!s||e.target.closest('.swipe-del'))return;el=s.querySelector('.swipe-fg');x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;mov=false;el.style.transition='none'},{passive:true});
  addEventListener('touchmove',e=>{if(!el)return;const ddx=e.touches[0].clientX-x0,ddy=e.touches[0].clientY-y0;if(!mov&&Math.abs(ddy)>Math.abs(ddx)){el.style.transition='';el=null;return}mov=true;const base=el.dataset.aberto?-84:0;dx=Math.min(0,Math.max(-110,base+ddx));el.style.transform=`translateX(${dx}px)`},{passive:true});

const campo=(id,label,tipo='text',val='',extra='')=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${tipo}" value="${esc(val)}" ${extra}></div>`;

  ${campo('atual','Parcela de '+MESES[+mes.slice(5)-1]+' é a nº','number',cur,'min="1" inputmode="numeric"')}
  ${sel('cat','Categoria',CATS,p?.categoria||'Compras')}
  ${rodape(`salvar('/api/parceladas${id?'/'+id:''}','${id?'PUT':'POST'}',{desc:v('desc'),valorParcela:v('val'),total:v('tot'),primeiroMes:addMes(mes,1-(+v('atual')||1)),categoria:v('cat')})`,id,'parceladas')}`)}
function formBoleto(id){const b=db.boletos.find(x=>x.id===id)||{};
  abrir(`<h2>${id?'Editar':'Novo'} boleto</h2>${campo('desc','De quem é',undefined,b.desc,'placeholder="Ex.: Fatura Itaú"')}
  <div class="row2">${valorCampo('val','Valor',b.valor)}${campo('venc','Vencimento','date',b.venc||cal(mes)+'-10')}</div>
  ${campo('cod','Código de barras / Pix (opcional)',undefined,b.codigo)}
  ${rodape(`salvar('/api/boletos${id?'/'+id:''}','${id?'PUT':'POST'}',{desc:v('desc'),valor:v('val'),venc:v('venc'),codigo:v('cod')})`,id,'boletos')}`)}
function formTricount(){abrir(`<h2>Tricount Victoria</h2>${valorCampo('val','Quanto a Victoria te deve em '+MESES[+mes.slice(5)-1],(db.tricount||{})[mes]||'')}
  <div class="sm">Esse valor sai dos seus gastos do mês, porque vocês usam o mesmo cartão.</div>
  ${rodape("salvar('/api/tricount','PUT',{valor:v('val'),mes})")}`)}
function formSaldo(){abrir(`<h2>Total já guardado</h2>${valorCampo('val','Quanto você já tinha guardado antes de usar o app',db.saldoInicial||'')}
  <div class="sm">O total acumulado é esse valor + tudo que você registrar em "Registrar valor guardado".</div>
  ${rodape("salvar('/api/saldo','PUT',{valor:v('val')})")}`)}
function formConta(){abrir(`<h2>Saldo em conta</h2>${valorCampo('val','Quanto tem na conta agora',db.conta?.saldo||'')}
  <div class="sm">Depois é só usar "Gastei da conta" que o app desconta sozinho.</div>
  ${rodape("salvar('/api/conta','PUT',{saldo:v('val')})")}`)}
function formGasteiConta(){if(!db.conta)return formConta();let cat='';
  abrir(`<h2>Gastei da conta</h2>${valorCampo('val','Valor')}
  <div class="field"><label>Categoria</label><div class="chips">${CATS.map(k=>`<button class="chip" data-c="${k}">${k}</button>`).join('')}</div></div>
  ${campo('desc','Descrição (opcional)',undefined,'','placeholder="Ex.: farmácia"')}
  <div class="sm">Saldo atual: ${brl(db.conta.saldo)}</div>
  ${rodape("salvar('/api/conta','POST',{valor:v('val'),desc:v('desc'),categoria:(document.querySelector('.chip.on[data-c]')||{}).dataset?.c||''})")}`);
  document.querySelectorAll('.chip[data-c]').forEach(b=>b.onclick=()=>{const on=b.classList.contains('on');document.querySelectorAll('.chip[data-c]').forEach(x=>x.classList.remove('on'));if(!on)b.classList.add('on')})}
function formReserva(id){const r=db.reserva.find(x=>x.id===id)||{};
  abrir(`<h2>${id?'Editar saldo':'Saldo da poupança'}</h2>${valorCampo('val','Saldo total',r.valor)}
  <div class="row2">${campo('mesr','Mês','month',r.mes||mes)}${campo('nota','Descrição (opcional)',undefined,r.nota,'placeholder="Ex.: itau"')}</div>
  <div class="sm">O guardado no mês é a diferença para o saldo anterior. Com "xp" na descrição, o valor só soma no total.</div>
  ${rodape(`salvar('/api/reserva${id?'/'+id:''}','${id?'PUT':'POST'}',{valor:v('val'),nota:v('nota'),mes:v('mesr')})`,id,'reserva')}`)}

// arrastar para baixo no topo da tela = atualizar
(function(){let y0=null,dy=0;const ind=document.createElement('div');ind.setAttribute('aria-hidden','true');
  ind.style.cssText='position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translate(-50%,-60px);width:36px;height:36px;border-radius:18px;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;z-index:40;transition:transform .2s;color:var(--navy)';
  ind.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>';document.body.appendChild(ind);
  addEventListener('touchstart',e=>{y0=(scrollY<=0&&!document.querySelector('.sheet-bg'))?e.touches[0].clientY:null;dy=0},{passive:true});
  addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);ind.style.transition='none';ind.style.transform=`translate(-50%,${Math.min(dy,90)-60}px) rotate(${dy*3}deg)`},{passive:true});
  addEventListener('touchend',async()=>{if(y0===null)return;y0=null;ind.style.transition='transform .2s';
    if(dy>70&&db){ind.style.transform='translate(-50%,20px)';ind.firstChild.animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:700,iterations:Infinity});await carregar();}
    ind.firstChild.getAnimations().forEach(a=>a.cancel());ind.style.transform='translate(-50%,-60px)'});
})();
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
carregar();
</script>
